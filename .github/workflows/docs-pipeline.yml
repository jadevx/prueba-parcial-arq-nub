name: Generar Documentación con IA

on:
  push:
    branches: [docs]

jobs:
  documentar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Ejecutar agente documentador
        env:
          KIRO_API_KEY: ${{ secrets.KIRO_API_KEY }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/jadevx/parcial-arq-nub/main/document.sh | bash -s -- "$KIRO_API_KEY" "docs/documentation.pdf"
        timeout-minutes: 12

      - name: Subir PDF como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: documentacion
          path: docs/documentation.pdf
